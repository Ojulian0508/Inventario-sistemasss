<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorías · Inventario de sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1E2A2F; --muted:#5E6B70; --line:#D8DDD9;
  --accent:#1B6E8A; --accent-ink:#FFFFFF; --danger:#B13A2B; --ok:#2E7D4F; --row:#EEF3F2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B1E; --card:#1B2428; --ink:#E6ECEA; --muted:#93A3A8; --line:#2E3B40;
    --accent:#5BB4D0; --accent-ink:#0E1A1E; --danger:#F08A7B; --ok:#6FCB93; --row:#223036;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,sans-serif}
header{padding:28px 24px 8px;max-width:1040px;margin:0 auto}
h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted)}
main{max-width:1040px;margin:0 auto;padding:16px 24px 48px;display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.toolbar{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar input{flex:1}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.9rem}
td.id{color:var(--muted);width:56px}
td.acc{white-space:nowrap;text-align:right}
tr:last-child td{border-bottom:0}
tr.editing td{background:var(--row)}
form{padding:18px 16px 16px}
form h2{margin:0 0 14px;font-size:1.1rem}
label{display:block;font-weight:500;font-size:.92rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
textarea{resize:vertical;min-height:84px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;margin-top:16px}
button{font:500 .95rem "Public Sans",system-ui,sans-serif;border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:0;background:none;padding:4px 8px;color:var(--accent)}
button.link.del{color:var(--danger)}
button:hover{filter:brightness(.96)}
.empty{padding:28px 16px;color:var(--muted)}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;padding:11px 16px;border-radius:8px;
  background:var(--ink);color:var(--paper);font-size:.95rem;display:none;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#msg.error{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){#msg.show{display:block;animation:in .18s ease-out}}
#msg.show{display:block}
@keyframes in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<header>
  <h1>Categorías</h1>
  <p>Administra las categorías de equipos del inventario de sistemas.</p>
</header>

<main>
  <section class="panel" aria-label="Lista de categorías">
    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar por nombre o descripción" aria-label="Buscar categoría">
      <span class="count" id="conteo"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Id</th><th>Nombre</th><th>Descripción</th><th></th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <div class="empty" id="vacio" hidden>No hay categorías que coincidan. Crea una nueva con el formulario.</div>
  </section>

  <form class="panel" id="form" autocomplete="off">
    <h2 id="titulo">Nueva categoría</h2>
    <input type="hidden" id="id">
    <label for="nombre">Nombre</label>
    <input id="nombre" maxlength="100" required>
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" maxlength="255"></textarea>
    <div class="btns">
      <button class="primary" type="submit" id="guardar">Crear categoría</button>
      <button type="button" id="cancelar" hidden>Cancelar</button>
    </div>
  </form>
</main>

<div id="msg" role="status" aria-live="polite"></div>

<script>
const API = '/categorias';
let items = [];
const $ = id => document.getElementById(id);

function aviso(texto, error = false) {
  const m = $('msg');
  m.textContent = texto;
  m.className = 'show' + (error ? ' error' : '');
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => m.className = '', 3500);
}

function esc(s) {
  return (s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function errorDe(r) {
  try { const j = await r.json(); return j.error || j.title || 'Ocurrió un error.'; }
  catch { return 'Ocurrió un error (código ' + r.status + ').'; }
}

async function cargar() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error(await errorDe(r));
    items = (await r.json()).sort((a, b) => a.idCategoria - b.idCategoria);
    pintar();
  } catch (e) {
    aviso('No se pudo conectar con la API. ¿Está corriendo dotnet run?', true);
  }
}

function pintar() {
  const q = $('buscar').value.trim().toLowerCase();
  const lista = items.filter(c =>
    c.nombre.toLowerCase().includes(q) || (c.descripcion ?? '').toLowerCase().includes(q));
  const editando = Number($('id').value);

  $('filas').innerHTML = lista.map(c => `
    <tr class="${c.idCategoria === editando ? 'editing' : ''}">
      <td class="id">${c.idCategoria}</td>
      <td>${esc(c.nombre)}</td>
      <td>${esc(c.descripcion)}</td>
      <td class="acc">
        <button class="link" data-editar="${c.idCategoria}">Editar</button>
        <button class="link del" data-borrar="${c.idCategoria}">Eliminar</button>
      </td>
    </tr>`).join('');

  $('vacio').hidden = lista.length > 0;
  $('conteo').textContent = lista.length + (lista.length === 1 ? ' categoría' : ' categorías');
}

function limpiar() {
  $('form').reset();
  $('id').value = '';
  $('titulo').textContent = 'Nueva categoría';
  $('guardar').textContent = 'Crear categoría';
  $('cancelar').hidden = true;
  pintar();
}

function editar(id) {
  const c = items.find(x => x.idCategoria === id);
  if (!c) return;
  $('id').value = c.idCategoria;
  $('nombre').value = c.nombre;
  $('descripcion').value = c.descripcion ?? '';
  $('titulo').textContent = 'Editar categoría ' + c.idCategoria;
  $('guardar').textContent = 'Guardar cambios';
  $('cancelar').hidden = false;
  $('nombre').focus();
  pintar();
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const id = $('id').value;
  const cuerpo = JSON.stringify({
    nombre: $('nombre').value.trim(),
    descripcion: $('descripcion').value.trim() || null
  });
  try {
    const r = await fetch(id ? `${API}/${id}` : API, {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: cuerpo
    });
    if (!r.ok) return aviso(await errorDe(r), true);
    aviso(id ? 'Cambios guardados.' : 'Categoría creada.');
    limpiar();
    await cargar();
  } catch { aviso('No se pudo conectar con la API.', true); }
});

$('filas').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.editar) return editar(Number(b.dataset.editar));
  if (b.dataset.borrar) {
    const id = Number(b.dataset.borrar);
    const c = items.find(x => x.idCategoria === id);
    if (!confirm(`¿Eliminar la categoría "${c.nombre}"?`)) return;
    try {
      const r = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (!r.ok) return aviso(await errorDe(r), true);
      aviso('Categoría eliminada.');
      if (Number($('id').value) === id) limpiar();
      await cargar();
    } catch { aviso('No se pudo conectar con la API.', true); }
  }
});

$('cancelar').addEventListener('click', limpiar);
$('buscar').addEventListener('input', pintar);
cargar();
</script>
</body>
</html>
